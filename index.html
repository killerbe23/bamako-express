<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BamakoExpress - Minimal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">

    <!-- En-tête simple et épuré -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-10">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-2">
                <span>⚡</span> BamakoExpress
            </h1>
            <span class="text-xs text-emerald-400 font-semibold bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">Mode Ultra-Rapide</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Caisse du jour (KPIs) -->
        <section class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl">
                <p class="text-[11px] text-slate-400 uppercase font-semibold">Dehors (Livreurs)</p>
                <p id="totalPending" class="text-lg font-bold text-amber-400 mt-0.5">0 FCFA</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl">
                <p class="text-[11px] text-slate-400 uppercase font-semibold">Encaissé Net</p>
                <p id="totalCollected" class="text-lg font-bold text-emerald-400 mt-0.5">0 FCFA</p>
            </div>
        </section>

        <!-- Formulaire condensé et rapide -->
        <section class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">➕ Nouvelle Course</h2>
            <form id="orderForm" class="space-y-2.5">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="clientName" placeholder="Client (Nom)" required
                        class="w-full p-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500">
                    <input type="tel" id="clientPhone" placeholder="Tél client" required
                        class="w-full p-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="quartier" placeholder="Quartier" required
                        class="w-full p-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500">
                    <input type="number" id="amount" placeholder="Montant (FCFA)" required
                        class="w-full p-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="driverName" placeholder="Livreur (Nom)" required
                        class="w-full p-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500">
                    <input type="tel" id="driverPhone" placeholder="Tél livreur" required
                        class="w-full p-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" 
                    class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md shadow-emerald-600/20">
                    Enregistrer la course
                </button>
            </form>
        </section>

        <!-- Liste épurée -->
        <section class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Courses du jour</h2>
                <button onclick="clearPaid()" class="text-[11px] text-rose-400 hover:underline">Nettoyer payées</button>
            </div>
            <div id="ordersList" class="space-y-2.5">
                <!-- Les cartes s'insèrent ici -->
            </div>
        </section>

    </main>

    <script>
        let orders = JSON.parse(localStorage.getItem('bamako_minimal')) || [];

        const form = document.getElementById('orderForm');
        const ordersList = document.getElementById('ordersList');
        const totalPendingEl = document
